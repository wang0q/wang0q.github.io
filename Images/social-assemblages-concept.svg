<path d="M817.7 314.6C817.7 291.6 828.5 287.3 842 287.3C855.5 287.3 866.3 291.6 866.3 314.6Z" fill="#ead0ba"/>
<circle cx="842" cy="270" r="13.5" fill="#ead0ba"/>
<text class="fi" x="892" y="300" font-size="15.5" font-weight="500" fill="#4f5a45">drawn in</text>
<text class="fi" x="892" y="318" font-size="15.5" font-weight="500" fill="#4f5a45">without knowing</text>
<text class="s" x="830" y="112" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="1.6" fill="#78836b">OTHER PEOPLE</text>
<line x1="452" y1="186" x2="708" y2="186" stroke="#2a3324" stroke-width="1.8" marker-end="url(#ars)"/>
<text class="s" x="610" y="176" font-size="13" text-anchor="middle" fill="#2a3324">polishes what goes out</text>
<line x1="708" y1="236" x2="452" y2="236" stroke="#2a3324" stroke-width="1.8" marker-end="url(#ars)"/>
<text class="s" x="610" y="258" font-size="13" text-anchor="middle" fill="#2a3324">filters what comes in</text>
<text class="s" x="40" y="338" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#78836b">TENSIONS</text>
<text class="s" x="590" y="338" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#78836b">TENSIONS</text>
<rect x="40" y="352" width="240" height="112" rx="14" fill="#ffffff" stroke="#d9ded2" stroke-width="1.2"/>
<rect x="40" y="370" width="3" height="24" rx="1.5" fill="#f4e285"/>
<text class="s" x="60" y="387" font-size="15" font-weight="600" fill="#2a3324">Blurred agency and</text>
<text class="s" x="60" y="406" font-size="15" font-weight="600" fill="#2a3324">identity</text>
<text class="s" x="60" y="430" font-size="13.5" fill="#4f5a45">Convenience now, but social</text>
<text class="s" x="60" y="449" font-size="13.5" fill="#4f5a45">skills and a sense of self at risk</text>
<rect x="300" y="352" width="240" height="112" rx="14" fill="#ffffff" stroke="#d9ded2" stroke-width="1.2"/>
<rect x="300" y="370" width="3" height="24" rx="1.5" fill="#f4e285"/>
<text class="s" x="320" y="387" font-size="15" font-weight="600" fill="#2a3324">Quantified sociality</text>
<text class="s" x="320" y="411" font-size="13.5" fill="#4f5a45">Social metrics offer insight, and</text>
<text class="s" x="320" y="430" font-size="13.5" fill="#4f5a45">stir up anxiety</text>
<rect x="590" y="352" width="240" height="112" rx="14" fill="#ffffff" stroke="#d9ded2" stroke-width="1.2"/>
<rect x="590" y="370" width="3" height="24" rx="1.5" fill="#f4e285"/>
<text class="s" x="610" y="387" font-size="15" font-weight="600" fill="#2a3324">Short-term ease, long-</text>
<text class="s" x="610" y="406" font-size="15" font-weight="600" fill="#2a3324">term erosion</text>
<text class="s" x="610" y="430" font-size="13.5" fill="#4f5a45">Filtered, polished exchanges</text>
<text class="s" x="610" y="449" font-size="13.5" fill="#4f5a45">feel easier but less authentic</text>
<rect x="850" y="352" width="240" height="112" rx="14" fill="#ffffff" stroke="#d9ded2" stroke-width="1.2"/>
<rect x="850" y="370" width="3" height="24" rx="1.5" fill="#f4e285"/>
<text class="s" x="870" y="387" font-size="15" font-weight="600" fill="#2a3324">AI as a social third party</text>
<text class="s" x="870" y="411" font-size="13.5" fill="#4f5a45">A non-judgmental advisor for</text>
<text class="s" x="870" y="430" font-size="13.5" fill="#4f5a45">the user; privacy and consent</text>
<text class="s" x="870" y="449" font-size="13.5" fill="#4f5a45">harms for others</text>
<rect x="20" y="492" width="1080" height="88" rx="16" fill="#fdfbee"/>
<text class="s" x="44" y="542" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#4a7a23">THE CALL</text>
<text class="f" x="172" y="532" font-size="22" font-weight="600" fill="#78836b">From user-centered design</text>
<text class="s" x="172" y="556" font-size="13.5" fill="#4f5a45">optimizing one user’s immediate experience</text>
<line x1="502" y1="536" x2="554" y2="536" stroke="#4a7a23" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arc)"/>
<text class="f" x="582" y="532" font-size="22" font-weight="600" fill="#4a7a23">To relational and provocative design</text>
<text class="s" x="582" y="556" font-size="13.5" fill="#2a3324">designing for relationships, with purposeful friction</text>
</svg>
