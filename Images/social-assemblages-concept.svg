<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-label="Concept of the study. A user and their social AI form a human–AI assemblage in which they co-shape each other. The AI polishes what the user sends out and filters what comes in from other people, some of whom are drawn in without knowing. Tensions arise for the individual (blurred agency and identity; quantified sociality) and between people (short-term ease, long-term erosion; AI as a social third party). The paper calls for a shift from user-centered to relational and provocative design.">
<title>Concept of the study. A user and their social AI form a human–AI assemblage in which they co-shape each other. The AI polishes what the user sends out and filters what comes in from other people, some of whom are drawn in without knowing. Tensions arise for the individual (blurred agency and identity; quantified sociality) and between people (short-term ease, long-term erosion; AI as a social third party). The paper calls for a shift from user-centered to relational and provocative design.</title>
