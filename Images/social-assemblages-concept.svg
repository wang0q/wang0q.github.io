<text class="s" x="40" y="38" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#4a7a23">THE INDIVIDUAL</text>
<text class="f" x="40" y="70" font-size="25" font-weight="600" fill="#2a3324">Inside the human–AI assemblage</text>
<text class="s" x="590" y="38" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#4a7a23">THE INTERPERSONAL</text>
<text class="f" x="590" y="70" font-size="25" font-weight="600" fill="#2a3324">Between the assemblage and others</text>
