<text class="s" x="196" y="274" font-size="13" font-weight="600" text-anchor="middle" fill="#4f5a45">User</text>
<line x1="382" y1="166" x2="382" y2="156" stroke="#2a3324" stroke-width="2"/><circle cx="382" cy="153" r="4" fill="#4a7a23"/><rect x="356" y="166" width="52" height="44" rx="13" fill="#f4e285" stroke="#2a3324" stroke-width="2"/><rect x="365" y="177" width="34" height="20" rx="8" fill="#ffffff"/><circle cx="375" cy="187" r="3" fill="#2a3324"/><circle cx="389" cy="187" r="3" fill="#2a3324"/><rect x="363" y="215" width="38" height="30" rx="9" fill="#f4e285" stroke="#2a3324" stroke-width="2"/><circle cx="352" cy="196" r="4.5" fill="#f4e285" stroke="#2a3324" stroke-width="1.6"/><circle cx="412" cy="196" r="4.5" fill="#f4e285" stroke="#2a3324" stroke-width="1.6"/>
<text class="s" x="382" y="274" font-size="13" font-weight="600" text-anchor="middle" fill="#4f5a45">Social AI</text>
<path d="M236 172Q289.0 136 340 172" fill="none" stroke="#4a7a23" stroke-width="1.8" marker-end="url(#arc)"/>
<path d="M340 234Q289.0 270 236 234" fill="none" stroke="#4a7a23" stroke-width="1.8" marker-end="url(#arc)"/>
<text class="fi" x="289" y="206" font-size="18" font-weight="500" text-anchor="middle" fill="#3d4f1c">co-shape</text>
<text class="fi" x="289" y="226" font-size="18" font-weight="500" text-anchor="middle" fill="#3d4f1c">each other</text>
