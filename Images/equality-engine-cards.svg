<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 436" width="1120" height="436" role="img" aria-label="Five example bias cards, one per category. Historical bias: Name Discrimination. Representation bias: Geographic Diversity. Measurement bias: Labeling Bias. Modeling bias: Machines Stick to It. Deployment bias: Irrelevant Assessment. Each card pairs a short title with a real case of bias in hiring or machine learning.">
<title>Five example bias cards, one per category. Historical bias: Name Discrimination. Representation bias: Geographic Diversity. Measurement bias: Labeling Bias. Modeling bias: Machines Stick to It. Deployment bias: Irrelevant Assessment. Each card pairs a short title with a real case of bias in hiring or machine learning.</title>
<defs>
<style>@font-face{font-family:'EE Serif';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.dp{font-family:Manrope, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.s{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.f{font-family:'EE Serif', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;font-variant-numeric:lining-nums}.fi{font-family:'EE Serif Italic', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;font-style:italic}</style>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2a3324" flood-opacity=".13"/></filter>
</defs>
<g transform="rotate(-1.6 123 219.5)">
<rect x="20.0" y="22" width="206" height="395" rx="16" fill="#ffffff" stroke="#d9ded2" stroke-width="1" filter="url(#sh)"/>
<path d="M20.0 66V38Q20.0 22 36.0 22H210.0Q226.0 22 226.0 38V66Z" fill="#e6f1ec"/>
<rect x="20.0" y="64" width="206" height="2" fill="#2f8a5f" opacity=".55"/>
<text class="s" x="36" y="49.5" font-size="11.5" font-weight="600" letter-spacing="1.3" fill="#2b7250">HISTORICAL BIAS</text>
<text class="f" x="36" y="104" font-size="25" font-weight="600" fill="#2a3324">Name</text>
<text class="f" x="36" y="131" font-size="25" font-weight="600" fill="#2a3324">Discrimination</text>
<rect x="36.0" y="146" width="28" height="2.5" rx="1.25" fill="#2f8a5f"/>
<text class="s" x="36" y="175" font-size="15.5" fill="#4f5a45">Same résumés with</text>
<text class="s" x="36" y="197" font-size="15.5" fill="#4f5a45">“white” names, such as</text>
<text class="s" x="36" y="219" font-size="15.5" fill="#4f5a45">Brendan Baker, got</text>
<text class="s" x="36" y="241" font-size="15.5" fill="#4f5a45">more callbacks than</text>
<text class="s" x="36" y="263" font-size="15.5" fill="#4f5a45">“Black” ones, such as</text>
<text class="s" x="36" y="285" font-size="15.5" fill="#4f5a45">Lakisha Washington.</text>
<line x1="36.0" y1="373" x2="210.0" y2="373" stroke="#d9ded2" stroke-width="1"/>
<text class="s" x="36" y="399" font-size="12" fill="#4f5a45"><tspan font-size="10" font-weight="600" letter-spacing="1.2" fill="#78836b">STAGE</tspan><tspan dx="7">State of the world</tspan></text>
</g>
<g transform="rotate(1.1 341.5 211.5)">
<rect x="238.5" y="14" width="206" height="395" rx="16" fill="#ffffff" stroke="#d9ded2" stroke-width="1" filter="url(#sh)"/>
<path d="M238.5 58V30Q238.5 14 254.5 14H428.5Q444.5 14 444.5 30V58Z" fill="#e8f2f8"/>
<rect x="238.5" y="56" width="206" height="2" fill="#3f8fc4" opacity=".55"/>
<text class="s" x="254.5" y="41.5" font-size="11.5" font-weight="600" letter-spacing="1.3" fill="#356c90">REPRESENTATION BIAS</text>
<text class="f" x="254.5" y="96" font-size="25" font-weight="600" fill="#2a3324">Geographic</text>
<text class="f" x="254.5" y="123" font-size="25" font-weight="600" fill="#2a3324">Diversity</text>
<rect x="254.5" y="138" width="28" height="2.5" rx="1.25" fill="#3f8fc4"/>
<text class="s" x="254.5" y="167" font-size="15.5" fill="#4f5a45">Research indicates that</text>
<text class="s" x="254.5" y="189" font-size="15.5" fill="#4f5a45">ML models trained on a</text>
<text class="s" x="254.5" y="211" font-size="15.5" fill="#4f5a45">face image dataset</text>
<text class="s" x="254.5" y="233" font-size="15.5" fill="#4f5a45">mostly from North</text>
<text class="s" x="254.5" y="255" font-size="15.5" fill="#4f5a45">America and Western</text>
<text class="s" x="254.5" y="277" font-size="15.5" fill="#4f5a45">Europe sometimes</text>
<text class="s" x="254.5" y="299" font-size="15.5" fill="#4f5a45">perform significantly</text>
<text class="s" x="254.5" y="321" font-size="15.5" fill="#4f5a45">worse on images from</text>
<text class="s" x="254.5" y="343" font-size="15.5" fill="#4f5a45">other areas.</text>
<line x1="254.5" y1="365" x2="428.5" y2="365" stroke="#d9ded2" stroke-width="1"/>
<text class="s" x="254.5" y="391" font-size="12" fill="#4f5a45"><tspan font-size="10" font-weight="600" letter-spacing="1.2" fill="#78836b">STAGE</tspan><tspan dx="7">Sample</tspan></text>
</g>
<g transform="rotate(-0.7 560 216.5)">
<rect x="457.0" y="19" width="206" height="395" rx="16" fill="#ffffff" stroke="#d9ded2" stroke-width="1" filter="url(#sh)"/>
<path d="M457.0 63V35Q457.0 19 473.0 19H647.0Q663.0 19 663.0 35V63Z" fill="#e9eaf3"/>
<rect x="457.0" y="61" width="206" height="2" fill="#44509c" opacity=".55"/>
<text class="s" x="473" y="46.5" font-size="11.5" font-weight="600" letter-spacing="1.3" fill="#44509c">MEASUREMENT BIAS</text>
<text class="f" x="473" y="101" font-size="25" font-weight="600" fill="#2a3324">Labeling Bias</text>
<rect x="473.0" y="116" width="28" height="2.5" rx="1.25" fill="#44509c"/>
<text class="s" x="473" y="145" font-size="15.5" fill="#4f5a45">MIT pulled offline a</text>
<text class="s" x="473" y="167" font-size="15.5" fill="#4f5a45">huge dataset that had</text>
<text class="s" x="473" y="189" font-size="15.5" fill="#4f5a45">been labeled by</text>
<text class="s" x="473" y="211" font-size="15.5" fill="#4f5a45">humans, because some</text>
<text class="s" x="473" y="233" font-size="15.5" fill="#4f5a45">of the labels contained</text>
<text class="s" x="473" y="255" font-size="15.5" fill="#4f5a45">derogatory language</text>
<text class="s" x="473" y="277" font-size="15.5" fill="#4f5a45">directed towards Black</text>
<text class="s" x="473" y="299" font-size="15.5" fill="#4f5a45">and Asian individuals.</text>
<line x1="473.0" y1="370" x2="647.0" y2="370" stroke="#d9ded2" stroke-width="1"/>
<text class="s" x="473" y="396" font-size="12" fill="#4f5a45"><tspan font-size="10" font-weight="600" letter-spacing="1.2" fill="#78836b">STAGE</tspan><tspan dx="7">Dataset</tspan></text>
</g>
<g transform="rotate(1.3 778.5 210.5)">
<rect x="675.5" y="13" width="206" height="395" rx="16" fill="#ffffff" stroke="#d9ded2" stroke-width="1" filter="url(#sh)"/>
<path d="M675.5 57V29Q675.5 13 691.5 13H865.5Q881.5 13 881.5 29V57Z" fill="#f5e7e7"/>
<rect x="675.5" y="55" width="206" height="2" fill="#ad3a33" opacity=".55"/>
<text class="s" x="691.5" y="40.5" font-size="11.5" font-weight="600" letter-spacing="1.3" fill="#ad3a33">MODELING BIAS</text>
<text class="f" x="691.5" y="95" font-size="25" font-weight="600" fill="#2a3324">Machines Stick</text>
<text class="f" x="691.5" y="122" font-size="25" font-weight="600" fill="#2a3324">to It</text>
<rect x="691.5" y="137" width="28" height="2.5" rx="1.25" fill="#ad3a33"/>
<text class="s" x="691.5" y="166" font-size="15.5" fill="#4f5a45">With gender-non-</text>
<text class="s" x="691.5" y="188" font-size="15.5" fill="#4f5a45">specific data, Amazon’s</text>
<text class="s" x="691.5" y="210" font-size="15.5" fill="#4f5a45">AI model still exhibited</text>
<text class="s" x="691.5" y="232" font-size="15.5" fill="#4f5a45">bias against women.</text>
<text class="s" x="691.5" y="254" font-size="15.5" fill="#4f5a45">For example, it relied</text>
<text class="s" x="691.5" y="276" font-size="15.5" fill="#4f5a45">on phrases like</text>
<text class="s" x="691.5" y="298" font-size="15.5" fill="#4f5a45">“women’s chess club”</text>
<text class="s" x="691.5" y="320" font-size="15.5" fill="#4f5a45">as a proxy for gender.</text>
<line x1="691.5" y1="364" x2="865.5" y2="364" stroke="#d9ded2" stroke-width="1"/>
<text class="s" x="691.5" y="390" font-size="12" fill="#4f5a45"><tspan font-size="10" font-weight="600" letter-spacing="1.2" fill="#78836b">STAGE</tspan><tspan dx="7">Algorithms</tspan></text>
</g>
<g transform="rotate(-1.2 997 220.5)">
<rect x="894.0" y="23" width="206" height="395" rx="16" fill="#ffffff" stroke="#d9ded2" stroke-width="1" filter="url(#sh)"/>
<path d="M894.0 67V39Q894.0 23 910.0 23H1084.0Q1100.0 23 1100.0 39V67Z" fill="#f7f0e4"/>
<rect x="894.0" y="65" width="206" height="2" fill="#bf7f1a" opacity=".55"/>
<text class="s" x="910" y="50.5" font-size="11.5" font-weight="600" letter-spacing="1.3" fill="#8a5d19">DEPLOYMENT BIAS</text>
<text class="f" x="910" y="105" font-size="25" font-weight="600" fill="#2a3324">Irrelevant</text>
<text class="f" x="910" y="132" font-size="25" font-weight="600" fill="#2a3324">Assessment</text>
<rect x="910.0" y="147" width="28" height="2.5" rx="1.25" fill="#bf7f1a"/>
<text class="s" x="910" y="176" font-size="15.5" fill="#4f5a45">Some popular work-</text>
<text class="s" x="910" y="198" font-size="15.5" fill="#4f5a45">related AI tools use a</text>
<text class="s" x="910" y="220" font-size="15.5" fill="#4f5a45">person’s speech</text>
<text class="s" x="910" y="242" font-size="15.5" fill="#4f5a45">patterns or facial</text>
<text class="s" x="910" y="264" font-size="15.5" fill="#4f5a45">expressions to infer</text>
<text class="s" x="910" y="286" font-size="15.5" fill="#4f5a45">work performance.</text>
<line x1="910.0" y1="374" x2="1084.0" y2="374" stroke="#d9ded2" stroke-width="1"/>
<text class="s" x="910" y="400" font-size="12" fill="#4f5a45"><tspan font-size="10" font-weight="600" letter-spacing="1.2" fill="#78836b">STAGE</tspan><tspan dx="7">Job applications</tspan></text>
</g>
</svg>
