<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 384" width="1120" height="384" role="img" aria-label="Overview of the three-phase study. Phase 1, Ideation, with 12 participants, produced a design space with two dimensions. Phase 2, Design, by the research team, produced 15 storyboards. Phase 3, Elicitation, with 18 participants, six of them returning from Phase 1, was analyzed into 4 themes. 24 people took part in total.">
<title>Overview of the three-phase study. Phase 1, Ideation, with 12 participants, produced a design space with two dimensions. Phase 2, Design, by the research team, produced 15 storyboards. Phase 3, Elicitation, with 18 participants, six of them returning from Phase 1, was analyzed into 4 themes. 24 people took part in total.</title>
