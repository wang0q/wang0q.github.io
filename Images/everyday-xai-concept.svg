<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 604" width="1120" height="604" role="img" aria-label="The paper&#x27;s two central questions. Question 1: do everyday users want AI to explain itself? A daily app&#x27;s AI pick offers &#x27;Why am I seeing this?&#x27; with two choices. &#x27;Not now&#x27; leads to the answer: not necessarily. XAI is not naturally accepted in daily life, and many people turn explanations down. Question 2: if so, how? &#x27;Explain&#x27; leads to three ideal designs: contextualized understanding, adoption and adaptation, and multistakeholder values.">
<title>The paper&#x27;s two central questions. Question 1: do everyday users want AI to explain itself? A daily app&#x27;s AI pick offers &#x27;Why am I seeing this?&#x27; with two choices. &#x27;Not now&#x27; leads to the answer: not necessarily. XAI is not naturally accepted in daily life, and many people turn explanations down. Question 2: if so, how? &#x27;Explain&#x27; leads to three ideal designs: contextualized understanding, adoption and adaptation, and multistakeholder values.</title>
