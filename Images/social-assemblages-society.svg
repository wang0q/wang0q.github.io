<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-label="A person and an AI co-shape each other, and combine into human–AI assemblages: a centaur with a human head on a four-legged AI body, an AI head on a human body, and a figure that is half human, half AI. Together with people and AIs, they form a mixed society, linked by social ties.">
