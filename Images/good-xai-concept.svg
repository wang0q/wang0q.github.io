<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-label="Concept of the study. An AI system is a black box to its users. Explainable AI (XAI) reflects certain aspects of it, guided by criteria C1 to Cn that frameworks recommend. Those criteria are judged good or important on the explanation itself, but the effects they have on users are unknown, and not necessarily good or important.">
<title>Concept of the study. An AI system is a black box to its users. Explainable AI (XAI) reflects certain aspects of it, guided by criteria C1 to Cn that frameworks recommend. Those criteria are judged good or important on the explanation itself, but the effects they have on users are unknown, and not necessarily good or important.</title>
